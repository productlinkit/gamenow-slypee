<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Subscribe — operator page (demo)</title>
<!--
  Stand-in for Jazz's own subscription landing page, so the hand-over can be clicked end to end.
  The real flow leaves the portal for Jazz, who identify the number, take the confirmation and
  do the billing, then send the player back to `return_url` with the result.

  In:   ?ref=15&var=1&camp=Slypee_Default&action=subscribe|manage|unsub&return_url=…
        (ref/var/camp are Jazz's attribution parameters, passed through by the portal)
  Out:  <return_url>?sub=success&plan=…&trial=1&renews=<epoch ms>&txn=…&action=…
        <return_url>?sub=cancelled
  Replace the whole page with the real Jazz landing page URL in src/lib/subscription.js (JAZZ_LP).
  Prices here mirror PLANS in that file — keep the two in step.
-->
<style>
  :root { color-scheme: light; --ink: #221A16; --line: #E6DCCB; --red: #DB2417; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #F3F4F6; color: var(--ink);
    font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  header { background: var(--ink); color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header b { font-size: 17px; letter-spacing: .02em; }
  header span { font-size: 12px; opacity: .75; font-variant-numeric: tabular-nums; }
  main { flex: 1; display: grid; place-items: start center; padding: 22px 16px 40px; }
  .card { width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .demo { max-width: 420px; width: 100%; margin: 0 0 12px; padding: 8px 12px; border-radius: 10px; background: #FEF3C7; border: 1px solid #FCD34D; font-size: 12.5px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .lede { margin: 0 0 16px; color: #5B5044; font-size: 14px; }
  dl { margin: 0 0 16px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  dt { color: #6B6257; font-size: 13px; }
  dd { margin: 0; font-weight: 600; text-align: right; font-size: 14px; }
  .terms { margin: 0 0 16px; padding: 12px; border-radius: 10px; background: #F9FAFB; border: 1px solid var(--line); font-size: 12.5px; color: #4B4238; }
  .terms p { margin: 0 0 6px; }
  .terms p:last-child { margin: 0; }
  button { width: 100%; font: inherit; font-weight: 600; border-radius: 10px; padding: 13px 16px; cursor: pointer; border: 1px solid transparent; }
  .go { background: var(--red); color: #fff; }
  .go:hover { background: #C41F13; }
  .no { background: #fff; color: #4B4238; border-color: var(--line); margin-top: 8px; }
  .no:hover { background: #F9FAFB; }
  footer { padding: 0 16px 24px; text-align: center; color: #6B6257; font-size: 12px; }
  .pick-label { margin: 0 0 8px; font-size: 13px; color: #6B6257; }
  .pack { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; margin-bottom: 8px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font: inherit; cursor: pointer; }
  .pack.on { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
  .pack i { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 1px solid #C9C0B2; }
  .pack.on i { border: 5px solid var(--red); }
  .pack b { flex: 1; font-weight: 600; }
  .pack span { color: #6B6257; font-size: 13px; }
  .camp { margin: 12px 0 0; font-size: 11px; color: #8A8175; text-align: center; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <header><b>Jazz</b><span id="short">9825</span></header>
  <main>
    <p class="demo">Demo stand-in for the operator's own subscription page — nothing here is real and no money moves.</p>
    <div class="card">
      <h1 id="title">Subscribe to Slypee Games</h1>
      <p class="lede" id="lede">Confirm to start the service on your Jazz number.</p>
      <div id="picker" hidden>
        <p class="pick-label">Choose a package</p>
        <div id="packs"></div>
      </div>
      <dl id="rows"></dl>
      <div class="terms" id="terms"></div>
      <button class="go" id="go">Confirm</button>
      <button class="no" id="no">Cancel</button>
    </div>
  </main>
  <footer>Slypee Games is a value-added service. Charges appear on your Jazz account.</footer>

<script>
  var PLANS = {
    month:   { label: "1 month",  price: 250,  days: 30,  every: "every month" },
    months3: { label: "3 months", price: 675,  days: 90,  every: "every 3 months" },
    months6: { label: "6 months", price: 1200, days: 180, every: "every 6 months" },
    year:    { label: "1 year",   price: 2100, days: 365, every: "every year" }
  };
  var TRIAL_DAYS = 1, DAY = 864e5;

  var q = new URLSearchParams(location.search);
  var action = q.get("action") || "subscribe";
  /* the portal doesn't pass a package — the operator's page is where it gets chosen */
  var plan = PLANS[q.get("plan")] ? q.get("plan") : "months6";
  var p = PLANS[plan];
  var trial = action === "subscribe";           // the free day is Jazz's welcome offer

  /* only ever go back to where we came from */
  function backTo(params) {
    var raw = q.get("return_url") || "/";
    var url;
    try { url = new URL(raw, location.origin); } catch (e) { url = new URL("/", location.origin); }
    if (url.origin !== location.origin) url = new URL("/", location.origin);
    Object.keys(params).forEach(function (k) { url.searchParams.set(k, params[k]); });
    location.replace(url.toString());
  }

  var money = function (n) { return "PKR " + n; };
  var onDate = function (ts) { return new Date(ts).toLocaleDateString(undefined, { day: "numeric", month: "short" }); };
  var firstCharge = Date.now() + (trial ? TRIAL_DAYS * DAY : 0);

  var rows = [];
  if (action === "unsub") {
    document.getElementById("title").textContent = "Stop Slypee Games?";
    document.getElementById("lede").textContent = "Your subscription will not renew again.";
    document.getElementById("go").textContent = "Stop the subscription";
    document.getElementById("no").textContent = "Keep it running";
    rows = [["Service", "Slypee Games"], ["Plan", p.label + " · " + money(p.price)], ["After stopping", "You can play until the paid period ends"]];
    document.getElementById("terms").innerHTML =
      "<p>Stopping takes effect straight away; charges already made are not refunded.</p>" +
      "<p>You can subscribe again at any time.</p>";
  } else if (action === "manage") {
    document.getElementById("title").textContent = "Your Slypee Games subscription";
    document.getElementById("lede").textContent = "Confirm to keep your subscription as it is.";
    document.getElementById("go").textContent = "Keep this plan";
    rows = [["Service", "Slypee Games"], ["Plan", p.label], ["Price", money(p.price) + " " + p.every]];
    document.getElementById("terms").innerHTML = "<p>To stop the service, send UNSUB to 9825.</p>";
  } else {
    rows = [
      ["Service", "Slypee Games"],
      ["Plan", p.label],
      ["Price", money(p.price) + " " + p.every + " (incl. tax)"],
      ["Free trial", TRIAL_DAYS + " day, free"],
      ["First charge", money(p.price) + " on " + onDate(firstCharge)]
    ];
    document.getElementById("terms").innerHTML =
      "<p>By confirming you agree that " + money(p.price) + " is charged to your Jazz account " + p.every + ", after the free day, until you stop the service.</p>" +
      "<p>Stop any time: send UNSUB to 9825. Send STATUS to 9825 to check your subscription.</p>";
  }

  function drawRows() {
    p = PLANS[plan];
    var list = rows;
    if (action === "subscribe") {
      list = [
        ["Service", "Slypee Games"],
        ["Price", money(p.price) + " " + p.every + " (incl. tax)"],
        ["Free trial", TRIAL_DAYS + " day, free"],
        ["First charge", money(p.price) + " on " + onDate(firstCharge)]
      ];
      document.getElementById("terms").innerHTML =
        "<p>By confirming you agree that " + money(p.price) + " is charged to your Jazz account " + p.every + ", after the free day, until you stop the service.</p>" +
        "<p>Stop any time: send UNSUB to 9825. Send STATUS to 9825 to check your subscription.</p>";
    }
    document.getElementById("rows").innerHTML = list.map(function (r) {
      return '<div class="row"><dt>' + r[0] + "</dt><dd>" + r[1] + "</dd></div>";
    }).join("");
  }

  /* the package is picked here, on the operator's page */
  if (action === "subscribe") {
    document.getElementById("picker").hidden = false;
    var packs = document.getElementById("packs");
    packs.innerHTML = Object.keys(PLANS).map(function (id) {
      var x = PLANS[id];
      return '<button type="button" class="pack' + (id === plan ? " on" : "") + '" data-plan="' + id + '">' +
        "<i></i><b>" + x.label + "</b><span>" + money(x.price) + " " + x.every + "</span></button>";
    }).join("");
    packs.addEventListener("click", function (e) {
      var btn = e.target.closest(".pack");
      if (!btn) return;
      plan = btn.dataset.plan;
      [].forEach.call(packs.children, function (el) { el.classList.toggle("on", el === btn); });
      drawRows();
    });
  }
  drawRows();

  var seen = ["ref", "var", "camp"].filter(function (k) { return q.get(k); })
    .map(function (k) { return k + "=" + q.get(k); }).join(" · ");
  if (seen) {
    var note = document.createElement("p");
    note.className = "camp";
    note.textContent = "Attribution received: " + seen;
    document.querySelector(".card").appendChild(note);
  }

  document.getElementById("go").onclick = function () {
    backTo({
      sub: "success",
      action: action,
      plan: plan,
      trial: trial ? "1" : "0",
      renews: String(Date.now() + (trial ? TRIAL_DAYS : p.days) * DAY),
      txn: "JZ" + Math.random().toString(36).slice(2, 8).toUpperCase()
    });
  };
  document.getElementById("no").onclick = function () { backTo({ sub: "cancelled", action: action }); };
</script>
</body>
</html>
